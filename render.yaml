services:
  - type: web
    name: ttrpg-mcp-server
    runtime: node
    buildCommand: npm ci && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: TRANSPORT
        value: http
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ttrpg
    healthCheckPath: /health
